name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  ios:
    name: iOS Build (IPA)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node scripts/set-version.mjs "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化并修补 iOS Xcode 工程
        run: |
          pnpm tauri ios init --ci
          bash scripts/patch-ios.sh
        env:
          APPLE_DEVELOPMENT_TEAM: "ABCDE12345"

      - name: 构建 iOS 应用与打包 IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhubX-iOS-IPA
          path: artifacts/*
          if-no-files-found: error

      - name: 发布 iOS GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}-ios"
          NOTES="## HGhubX iOS 正式版 (v${V})

          ### ✨ 核心特性
          - 基于 HGhubX 全新架构，优化剧集解析流与界面流畅度；
          - **修复 iOS 无法连接**：内置原生系统网络权限请求触发机制，启动时自动唤起系统「允许使用无线局域网与蜂窝网络」授权对话框；
          - **优化移动网络 DNS 选路**：过滤特征污染 IPv6 地址，移动端智能优先稳定 IPv4 链路；
          - **修复底部空白区域**：将 WKWebView 安全边距调整模式设为 Never，禁用弹性回弹与白底，沉浸贴合屏幕底边。

          ### 📲 安装说明（免证书生产包 \`.ipa\`）
          1. **TrollStore（巨魔商店）**：下载 \`HGhubX_${V}_ios.ipa\` 后直接导入巨魔永久安装；
          2. **AltStore / SideStore / Sideloadly**：使用个人 Apple ID 自签安装；
          3. **轻松签（ESign）/ 牛蛙助手 / Feather / 全能签**：导入证书签名后直接安装。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.ipa --clobber
            gh release edit "$TAG" --title "HGhubX v${V} iOS 正式版" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create "$TAG" artifacts/*.ipa \
              --title "HGhubX v${V} iOS 正式版" \
              --notes "$NOTES" \
              --latest
          fi
